<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Location Service</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f7f8fb;
            --surface: #ffffff;
            --ink: #172033;
            --muted: #697386;
            --line: #d9deea;
            --accent: #1463ff;
            --accent-dark: #0d47bd;
            --success: #0f766e;
            --danger: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .shell {
            width: min(1040px, calc(100% - 32px));
            margin: 0 auto;
            padding: 42px 0;
        }

        .topbar {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 34px;
            line-height: 1.1;
            font-weight: 750;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            min-height: 34px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(280px, 360px) 1fr;
            gap: 18px;
            align-items: start;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
        }

        .panel h2 {
            margin: 0 0 16px;
            font-size: 17px;
            line-height: 1.3;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 650;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0 12px;
            color: var(--ink);
            font: inherit;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(20, 99, 255, 0.12);
        }

        button {
            min-height: 44px;
            border: 0;
            border-radius: 6px;
            padding: 0 16px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover {
            background: var(--accent-dark);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.68;
        }

        .samples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .sample {
            min-height: 32px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--muted);
            font-size: 13px;
            font-weight: 650;
        }

        .sample:hover {
            background: #eef3ff;
            color: var(--accent-dark);
        }

        .result-empty,
        .error {
            color: var(--muted);
            font-size: 14px;
        }

        .error {
            color: var(--danger);
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .metric {
            min-height: 78px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 12px;
            background: #fbfcff;
        }

        .metric span {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .metric strong {
            display: block;
            overflow-wrap: anywhere;
            font-size: 16px;
            line-height: 1.35;
        }

        .source {
            margin-top: 14px;
            padding: 12px;
            border-left: 3px solid var(--success);
            background: #eefaf8;
            color: #134e4a;
            font-size: 14px;
        }

        @media (max-width: 780px) {
            .topbar,
            .grid,
            .input-row {
                display: block;
            }

            .status,
            button {
                width: 100%;
                margin-top: 12px;
                justify-content: center;
            }

            .panel + .panel {
                margin-top: 16px;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main class="shell">
    <header class="topbar">
        <div>
            <h1>IP Location Service</h1>
            <p class="subtitle">Resolve public IP addresses with MaxMind GeoLite2, Redis caching, and API usage logging.</p>
        </div>
        <span id="status" class="status">Checking API</span>
    </header>

    <section class="grid">
        <form id="lookupForm" class="panel">
            <h2>Lookup</h2>
            <label for="ipInput">IP address</label>
            <div class="input-row">
                <input id="ipInput" name="ip" type="text" value="8.8.8.8" autocomplete="off" placeholder="8.8.8.8" required>
                <button id="submitButton" type="submit">Search</button>
            </div>
            <div class="samples" aria-label="Sample IP addresses">
                <button class="sample" type="button" data-ip="8.8.8.8">8.8.8.8</button>
                <button class="sample" type="button" data-ip="1.1.1.1">1.1.1.1</button>
                <button class="sample" type="button" data-ip="208.67.222.222">208.67.222.222</button>
            </div>
        </form>

        <section class="panel" aria-live="polite">
            <h2>Result</h2>
            <div id="result" class="result-empty">Run a lookup to see city, region, country, and coordinates.</div>
        </section>
    </section>
</main>

<script>
    const form = document.getElementById("lookupForm");
    const ipInput = document.getElementById("ipInput");
    const result = document.getElementById("result");
    const status = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    function renderResult(data) {
        result.className = "";
        result.innerHTML = `
            <div class="result-grid">
                <div class="metric"><span>IP</span><strong>${data.ipAddress || "Unavailable"}</strong></div>
                <div class="metric"><span>City</span><strong>${data.city || "Unavailable"}</strong></div>
                <div class="metric"><span>State</span><strong>${data.state || "Unavailable"}</strong></div>
                <div class="metric"><span>Country</span><strong>${data.country || "Unavailable"}</strong></div>
                <div class="metric"><span>Latitude</span><strong>${data.latitude ?? "Unavailable"}</strong></div>
                <div class="metric"><span>Longitude</span><strong>${data.longitude ?? "Unavailable"}</strong></div>
            </div>
            <div class="source">${data.message || "Resolved from configured geolocation provider."}</div>
        `;
    }

    function renderError(message) {
        result.className = "error";
        result.textContent = message;
    }

    async function lookupIp(ip) {
        submitButton.disabled = true;
        status.textContent = "Searching";
        result.className = "result-empty";
        result.textContent = "Querying location service...";

        try {
            const response = await fetch("/api/location/ip", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ip}),
            });
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.message || payload.detail || `Request failed with ${response.status}`);
            }
            renderResult(payload);
            status.textContent = "API online";
        } catch (error) {
            renderError(error.message);
            status.textContent = "Check failed";
        } finally {
            submitButton.disabled = false;
        }
    }

    form.addEventListener("submit", (event) => {
        event.preventDefault();
        lookupIp(ipInput.value.trim());
    });

    document.querySelectorAll("[data-ip]").forEach((button) => {
        button.addEventListener("click", () => {
            ipInput.value = button.dataset.ip;
            lookupIp(button.dataset.ip);
        });
    });

    fetch("/api/location/ip", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ip: "8.8.8.8"}),
    })
        .then((response) => {
            status.textContent = response.ok ? "API online" : "API reachable";
        })
        .catch(() => {
            status.textContent = "API unavailable";
        });
</script>
</body>
</html>
