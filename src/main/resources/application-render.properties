spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT}}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:${SPRING_REDIS_USERNAME:default}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${SPRING_REDIS_PASSWORD}}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:${SPRING_REDIS_SSL:true}}
spring.data.redis.timeout=5000ms

whosonfirst.enabled=false
logging.level.root=INFO
logging.level.com.mnnitproject.location_service=DEBUG
